<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404. Nothing to see here | cipher.</title>
  <meta name="theme-color" content="#f4f4f2">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/images/eagle.png" type="image/png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("cipher-theme"); } catch (e) {}
      if (t !== "xray" && t !== "paper") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "xray" : "paper";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="page-404">

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="wordmark" aria-label="cipher. Home">cipher<span class="dot">.</span></a>
  </div>
</header>

<main>
  <div class="container">
    <p class="mono code-line">GET <span id="path">/this-page</span> &rarr; <b>404 Not Found</b></p>
    <h1 class="display-xl">Nothing to see<br>here<span class="dot">.</span></h1>
    <p class="lead">I looked closely. This page doesn't exist, or it moved. The rest of the site is still where you left it.</p>
    <div class="actions">
      <a class="btn-pill" href="/">Back home <span class="btn-icon"><svg class="i-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg></span></a>
    </div>
  </div>
</main>

<script>
  try {
    document.getElementById("path").textContent = decodeURIComponent(location.pathname);
  } catch (e) {}
</script>
</body>
</html>
